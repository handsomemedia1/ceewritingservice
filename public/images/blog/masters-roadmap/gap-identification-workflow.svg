<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="auto" style="background: linear-gradient(135deg, #1a1a24, #0d0d12); border-radius: 12px; font-family: 'Space Grotesk', sans-serif, system-ui;">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B470" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C5A059" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="none" rx="12" />
  
  <text x="40" y="60" fill="#C5A059" font-size="24" font-weight="bold" letter-spacing="1">Gap Workflow</text>
  <line x1="40" y1="80" x2="760" y2="80" stroke="rgba(197,160,89,0.3)" stroke-width="2" />
  
  <text x="40" y="120" fill="#ffffff" font-size="18" opacity="0.8">Literature -> Contradictions -> Proposed Study</text>
  
  <g transform="translate(40, 160)">
    <rect x="50" y="20" width="200" height="80" rx="8" fill="rgba(255,255,255,0.05)" stroke="url(#gold)" stroke-width="2"/><text x="150" y="65" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">Concept A</text><path d="M 270 60 L 380 60" stroke="rgba(197,160,89,0.6)" stroke-width="3" marker-end="url(#arrow)" /><rect x="400" y="20" width="200" height="80" rx="8" fill="rgba(255,255,255,0.05)" stroke="url(#gold)" stroke-width="2"/><text x="500" y="65" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">Concept B</text>
  </g>
</svg>